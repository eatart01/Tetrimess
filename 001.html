<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>過場示意圖設計工作區 V2 (圖片置換版)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 60px; background: #0a0a0c; color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { text-align: center; font-size: 1.3rem; margin: 0 0 4px; color: #f1f5f9; }
  .sub { text-align: center; color: #a1a1aa; font-size: 0.82rem; margin: 0 0 20px; }

  .tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 18px; }
  .tab-btn {
    padding: 10px 16px; background: #27272a; border: 1px solid #3f3f46; border-radius: 999px;
    color: #d4d4d8; cursor: pointer; font-weight: 700; font-size: 0.85rem; user-select: none;
  }
  .tab-btn.active { background: #4f46e5; border-color: #4f46e5; color: #fff; }

  /* ===== 遊戲內過場畫面的樣式 ===== */
  .preview-frame {
    width: 100%; max-width: 390px; height: 520px; margin: 0 auto;
    background: #000; border-radius: 20px; border: 2px solid #27272a;
    position: relative; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
  }
  .game-intro-countdown {
    position: absolute; top: 14px; right: 14px;
    background: rgba(63,63,70,0.9); border: 1px solid #71717a; color: #e2e8f0;
    padding: 6px 14px; border-radius: 8px; font-size: 1rem; font-weight: 700; letter-spacing: 0.5px;
  }
  .game-intro-content { display: flex; flex-direction: column; align-items: center; gap: 26px; }
  .game-intro-tagline { font-size: 1.9rem; font-weight: 800; color: #f1f5f9; letter-spacing: 0.5px; text-align: center; }
  .game-intro-skip {
    position: absolute; right: 16px; bottom: 16px;
    background: rgba(63,63,70,0.9); border: 1px solid #71717a; color: #e2e8f0;
    padding: 12px 22px; border-radius: 999px; font-size: 1rem; font-weight: 700;
  }

  .intro-illust-box { position: relative; overflow: hidden; /* 確保超出容器的圖片不顯示 */ }
  .intro-image {
    position: absolute;
    display: block;
    max-width: none; /* 允許圖片縮放到 imgW 設定的大小 */
  }

  /* ===== 控制面板 ===== */
  .controls-panel {
    max-width: 390px; margin: 20px auto 0; background: #141417; border: 1px solid #27272a;
    border-radius: 14px; padding: 16px 18px;
  }
  .controls-title { font-size: 0.85rem; font-weight: 700; color: #cbbe93; margin: 0 0 12px; }
  .control-row { margin-bottom: 14px; }
  .control-row label {
    font-size: 0.8rem; color: #a1a1aa; display: flex; justify-content: space-between; margin-bottom: 4px;
  }
  .control-row label span.val { color: #e2e8f0; font-weight: 700; font-family: monospace; }
  .control-row input[type="range"] { width: 100%; accent-color: #4f46e5; }
  
  .reset-btn {
    display: block; width: 100%; margin-top: 4px; padding: 10px; background: #27272a; border: 1px solid #3f3f46;
    border-radius: 8px; color: #e2e8f0; font-weight: 700; font-size: 0.85rem; cursor: pointer;
  }
  .reset-btn:active { background: #3f3f46; }

  .output-box {
    max-width: 390px; margin: 16px auto 0; background: #0a0a0c; border: 1px solid #27272a; border-radius: 10px;
    padding: 12px 14px; font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 0.74rem; color: #4ade80;
    white-space: pre-wrap; word-break: break-all; line-height: 1.6; max-height: 220px; overflow-y: auto;
  }
  .copy-btn {
    display: block; width: 100%; max-width: 390px; margin: 12px auto 0; padding: 12px; background: #059669;
    border: none; border-radius: 10px; color: #fff; font-weight: 700; font-size: 0.9rem; cursor: pointer;
  }
  .copy-btn:active { background: #047857; }
  .copy-hint { text-align: center; font-size: 0.75rem; color: #71717a; margin-top: 6px; }
</style>
</head>
<body>

  <h1>過場示意圖設計工作區 V2 (圖片置換版)</h1>
  <p class="sub">以圖片中基座為基準，手動計算並對齊，滿意後複製設定值給 Claude</p>

  <div class="tabs" id="tabs"></div>

  <div class="preview-frame">
    <div class="game-intro-countdown">10s</div>
    <div class="game-intro-content">
      <div class="intro-illust-box" id="illustBox"></div>
      <div class="game-intro-tagline" id="tagline"></div>
    </div>
    <div class="game-intro-skip">Skip ⏭</div>
  </div>

  <div class="controls-panel">
    <div class="controls-title" id="controlsTitle">調整圖片對齊與縮放</div>
    <div id="controlsBody"></div>
    <button class="reset-btn" onclick="resetCurrent()">還原這張圖的預設對齊</button>
  </div>

  <div class="output-box" id="outputBox"></div>
  <button class="copy-btn" onclick="copyOutput()">📋 複製目前設定值</button>
  <p class="copy-hint">複製後貼給 Claude，說「幫我套用這份設計工作區的設定」即可</p>

<script>
  // ============ 核心對齊參數 (以基座位置為基準) ============
  // 我們手動計算了 imgX 和 imgY 負偏移量，將每張圖中的基座移動到容器 (160x110) 的底部中線。
  const DEFAULTS = {
    solo: {
      tagline: 'Reach the Line', kind: 'image',
      boxW: 160, boxH: 110,
      imgUrl: 'image_0.png', // 單人/雙人共用圖示 (代碼中使用同一張圖表示)
      imgX: -10, // 手動計算的對齊 X (修正 center 偏差)
      imgY: -60, // 手動計算的對齊 Y (將基座移到底部)
      imgW: 240 // 調整視覺大小 (將基座縮放為約 50px 寬)
    },
    coop: {
      tagline: 'Reach the Line', kind: 'image',
      boxW: 160, boxH: 110,
      imgUrl: 'image_0.png',
      imgX: -10,
      imgY: -60,
      imgW: 240
    },
    versus: {
      tagline: 'Do Not Drop', kind: 'image',
      boxW: 160, boxH: 110,
      imgUrl: 'image_1.png', // 對抗圖示
      imgX: -30, // 手動計算的對齊 X
      imgY: -90, // 手動計算的對齊 Y
      imgW: 280 // 調整視覺大小
    },
    topple: {
      tagline: 'Topple to Score', kind: 'image',
      boxW: 160, boxH: 110,
      imgUrl: 'image_2.png', // 掉落得分圖示 (含👍)
      imgX: -30,
      imgY: -90,
      imgW: 280
    }
  };

  const TAB_LABELS = { solo: '單人遊玩', coop: '雙人堆疊', versus: '對抗', topple: '掉落得分' };
  let state = JSON.parse(JSON.stringify(DEFAULTS));
  let currentTab = 'solo';

  function renderTabs() {
    const wrap = document.getElementById('tabs');
    wrap.innerHTML = Object.keys(TAB_LABELS).map(key =>
      `<div class="tab-btn${key === currentTab ? ' active' : ''}" onclick="switchTab('${key}')">${TAB_LABELS[key]}</div>`
    ).join('');
  }

  function switchTab(key) {
    currentTab = key;
    renderTabs();
    renderControls();
    renderIllustration();
    renderOutput();
  }

  function resetCurrent() {
    state[currentTab] = JSON.parse(JSON.stringify(DEFAULTS[currentTab]));
    renderControls();
    renderIllustration();
    renderOutput();
  }

  // ============ 圖片調整面板欄位 ============
  const FIELD_DEFS = {
    image: [
      { key: 'imgX', label: '圖片偏移 X (修正 center)', min: -100, max: 100, step: 1 },
      { key: 'imgY', label: '圖片偏移 Y (將基座對齊底部)', min: -150, max: 0, step: 1 },
      { key: 'imgW', label: '圖片縮放寬度 (調整基座大小)', min: 100, max: 600, step: 10 },
    ],
  };

  function renderControls() {
    const cfg = state[currentTab];
    document.getElementById('controlsTitle').innerText = TAB_LABELS[currentTab] + '｜調整圖片對齊';
    const fields = FIELD_DEFS[cfg.kind];
    const body = document.getElementById('controlsBody');
    body.innerHTML = fields.map(f => `
      <div class="control-row">
        <label>${f.label} <span class="val" id="val-${f.key}">${cfg[f.key]}</span></label>
        <input type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${cfg[f.key]}"
               oninput="updateField('${f.key}', this.value)">
      </div>
    `).join('');
  }

  function updateField(key, value) {
    const num = parseFloat(value);
    state[currentTab][key] = isNaN(num) ? value : num;
    const valEl = document.getElementById('val-' + key);
    if (valEl) valEl.innerText = state[currentTab][key];
    renderIllustration();
    renderOutput();
  }

  // ============ 畫示意圖 (載入並定位圖片) ============
  function renderIllustration() {
    const cfg = state[currentTab];
    const box = document.getElementById('illustBox');
    document.getElementById('tagline').innerText = cfg.tagline;
    box.style.width = cfg.boxW + 'px';
    box.style.height = cfg.boxH + 'px';

    // 移除所有舊內容，只插入圖片
    box.innerHTML = `<img src="${cfg.imgUrl}" class="intro-image" alt="示意圖">`;
    
    // 定位和縮放圖片
    const imgEl = box.querySelector('.intro-image');
    imgEl.style.left = cfg.imgX + 'px';
    imgEl.style.top = cfg.imgY + 'px';
    imgEl.style.width = cfg.imgW + 'px';
  }

  function renderOutput() {
    const out = { solo: state.solo, coop: state.coop, versus: state.versus, topple: state.topple };
    document.getElementById('outputBox').innerText = JSON.stringify(out, null, 2);
  }

  function copyOutput() {
    const text = document.getElementById('outputBox').innerText;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => alert('已複製對齊設定！貼給 Claude 就可以了。'))
        .catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); alert('已複製對齊設定！貼給 Claude 就可以了。'); }
    catch (e) { alert('複製失敗，請手動選取下面的文字方塊複製。'); }
    document.body.removeChild(ta);
  }

  // init
  renderTabs();
  renderControls();
  renderIllustration();
  renderOutput();
</script>
</body>
</html>
