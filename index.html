<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>背景節流測試版（Web Worker）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background-color: #0f0f12; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #94a3b8; display: flex; align-items: center; justify-content: center;
    height: 100vh; width: 100vw; overflow: hidden; flex-direction: column; gap: 12px;
  }
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,10,12,0.92);
    display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
  }
  .modal-overlay.hidden { display: none; }
  .title { font-size: 1.4rem; font-weight: 700; color: #f1f5f9; margin-bottom: 8px; }
  .desc { font-size: 0.9rem; color: #94a3b8; margin-bottom: 16px; text-align: center; }
  .btn { padding: 10px 20px; background: #4f46e5; color: #fff; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #4338ca; }
  .btn.green { background: #059669; }
  .btn.green:hover { background: #047857; }
  .btn-copy { background: #3f3f46; color: #e2e8f0; border: 1px solid #52525b; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
  .room-input { background: #18181c; border: 1px solid #3f3f46; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; outline: none; width: 160px; text-align: center; }

  #statusText { font-size: 0.95rem; color: #cbd5e1; }
  .badge { display: inline-block; background: #312e81; color: #c7d2fe; font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
  .game-container { position: relative; background: #141417; border-radius: 10px; border: 1px solid #27272a; overflow: hidden; }
  canvas { display: block; }

  #diagPanel {
    width: 320px; background: #18181c; border: 1px dashed #3f3f46; border-radius: 8px; padding: 8px 10px;
    font-size: 0.72rem; color: #818cf8; line-height: 1.6;
  }
  #diagPanel h4 { color: #cbd5e1; font-size: 0.75rem; margin-bottom: 4px; }
  #diagLog { max-height: 100px; overflow-y: auto; font-family: monospace; color: #71717a; margin-top: 4px; border-top: 1px solid #27272a; padding-top: 4px; }
  #diagLog div:last-child { color: #22c55e; }
</style>
</head>
<body>

  <div id="lobbyOverlay" class="modal-overlay">
    <div class="title">背景節流測試 - Web Worker 版<span class="badge">主機物理跑在獨立執行緒</span></div>
    <div class="desc">跟正式版用同一套 PeerJS 連線架構<br>差別在於 P1 的物理模擬搬進 Web Worker，不受分頁節流影響</div>
    <div style="display:flex; flex-direction:column; gap:14px; align-items:center;">
      <button class="btn" onclick="createRoom()">建立房間 (我是 P1)</button>
      <div style="display:flex; gap:8px; align-items:center;">
        <input type="text" id="roomInput" class="room-input" placeholder="輸入房間 ID">
        <button class="btn green" onclick="joinRoom()">加入房間 (我是 P2)</button>
      </div>
    </div>
    <div class="desc" id="lobbyStatus" style="margin-top:14px;"></div>
  </div>

  <div id="statusText">請先連線</div>

  <div class="game-container">
    <canvas id="gameCanvas" width="300" height="480"></canvas>
  </div>

  <button class="btn" onclick="resetGame()">重新開始</button>

  <div id="diagPanel">
    <h4>連線診斷</h4>
    <div id="diagRole">身分：尚未連線</div>
    <div id="diagCounters">rAF次數: 0　worker次數: 0　廣播/收到次數: 0</div>
    <div id="diagLog"></div>
  </div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// =========================================================================
// Web Worker 原始碼：用字串內嵌 + Blob URL 建立，維持單一 HTML 檔案的原則。
// 只有 P1（主機）會建立、使用這個 Worker。P2 完全不需要它（P2 本來就只是
// 顯示端，不跑任何物理模擬）。
// 這個 Worker 裡面是「完整獨立的一份遊戲邏輯」：載入 Matter.js、跑物理、
// 處理按鍵、判斷落地/換人，透過 postMessage 把結果丟回主執行緒。
// Worker 用 setInterval 驅動（Worker 裡沒有 requestAnimationFrame），
// 而且 Worker 完全不受「分頁是否可見」的節流機制影響，這是這個架構的核心。
// =========================================================================
const WORKER_SOURCE = `
  importScripts('https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js');

  const TILE_SIZE = 24, CANVAS_WIDTH = 300, CANVAS_HEIGHT = 480, BAR_ROWS = 4;
  const { Engine, Bodies, Composite, Body, Events } = Matter;
  const engine = Engine.create({ positionIterations: 18, velocityIterations: 18, enableSleeping: false, gravity: { x: 0, y: 1.2, scale: 0.001 } });

  let currentPlayer = 1, statusMsg = 'P1 回合：←→移動，空白鍵丟下';
  let placedBodies = [], posX = CANVAS_WIDTH / 2, currentDropped = null, hasTouched = false, touchTime = 0;
  let workerTickCount = 0;

  function makeBody(x, y, isStatic, width, height) {
    const body = Bodies.rectangle(x, y, width, height, {
      isStatic, friction: 1.2, frictionStatic: 1.4, frictionAir: 0.06, restitution: 0, density: 0.002
    });
    body.tileGrid = { rows: height / TILE_SIZE, cols: width / TILE_SIZE, tileSize: TILE_SIZE };
    Composite.add(engine.world, body);
    return body;
  }

  function initGame() {
    placedBodies.forEach(b => Composite.remove(engine.world, b)); placedBodies = [];
    currentPlayer = 1; posX = CANVAS_WIDTH / 2; currentDropped = null; hasTouched = false;
    statusMsg = 'P1 回合：←→移動，空白鍵丟下';
    const base = makeBody(CANVAS_WIDTH / 2, CANVAS_HEIGHT - TILE_SIZE, true, CANVAS_WIDTH - 40, TILE_SIZE);
    placedBodies.push(base);
  }

  function handleKey(key) {
    if (currentDropped) return;
    if (key === 'ARROWLEFT') posX = Math.max(TILE_SIZE, posX - TILE_SIZE);
    else if (key === 'ARROWRIGHT') posX = Math.min(CANVAS_WIDTH - TILE_SIZE, posX + TILE_SIZE);
    else if (key === ' ') {
      currentDropped = makeBody(posX, 60, false, TILE_SIZE, TILE_SIZE * BAR_ROWS);
      placedBodies.push(currentDropped); hasTouched = false;
    }
    statusMsg = 'P' + currentPlayer + ' 回合：←→移動，空白鍵丟下';
  }

  Events.on(engine, 'collisionStart', (e) => {
    if (currentDropped && !hasTouched) {
      e.pairs.forEach(p => { if (p.bodyA === currentDropped || p.bodyB === currentDropped) { hasTouched = true; touchTime = Date.now(); } });
    }
  });

  function switchTurn() {
    currentDropped = null;
    currentPlayer = currentPlayer === 1 ? 2 : 1;
    statusMsg = 'P' + currentPlayer + ' 回合：←→移動，空白鍵丟下';
  }

  function checkSettled() {
    if (!currentDropped || !hasTouched) return;
    if (Date.now() - touchTime < 1200) return;
    switchTurn();
  }

  function tick() {
    workerTickCount++;
    Engine.update(engine, 1000 / 60);
    placedBodies.forEach(b => {
      if (!b.isStatic) {
        const s = Math.hypot(b.velocity.x, b.velocity.y);
        if (s > 18) Body.setVelocity(b, { x: b.velocity.x * 18 / s, y: b.velocity.y * 18 / s });
      }
    });
    if (currentDropped && currentDropped.position.y > CANVAS_HEIGHT + 30) switchTurn();
    checkSettled();
    placedBodies = placedBodies.filter(b => {
      if (b.position.y > CANVAS_HEIGHT + 60) { Composite.remove(engine.world, b); return false; }
      return true;
    });

    postMessage({
      type: 'STATE',
      currentPlayer, statusMsg, posX, showPreview: !currentDropped, workerTickCount,
      bodies: placedBodies.map(b => ({
        id: b.id,
        x: Math.round(b.position.x * 10) / 10, y: Math.round(b.position.y * 10) / 10,
        angle: Math.round(b.angle * 100) / 100, tileGrid: b.tileGrid, isStatic: b.isStatic
      }))
    });
  }

  self.onmessage = (e) => {
    const msg = e.data;
    if (msg.type === 'INIT') initGame();
    else if (msg.type === 'KEY') handleKey(msg.key);
  };

  setInterval(tick, 1000 / 60); // Worker 用 setInterval 驅動，不受分頁可見性節流影響
`;

let physicsWorker = null;
function createPhysicsWorker() {
  const blob = new Blob([WORKER_SOURCE], { type: 'application/javascript' });
  physicsWorker = new Worker(URL.createObjectURL(blob));
  physicsWorker.onmessage = (e) => {
    if (e.data.type !== 'STATE') return;
    workerTickCount = e.data.workerTickCount;
    currentPlayer = e.data.currentPlayer; statusMsg = e.data.statusMsg;
    posX = e.data.posX; showPreview = e.data.showPreview; localBodies = e.data.bodies;
    document.getElementById('statusText').innerText = statusMsg;

    // 廣播頻率沿用原本邏輯（約每 2 次訊息送一次），不因為改用 Worker 就增加網路流量；
    // 這裡故意不放進 rAF 迴圈，而是資料一到就直接判斷要不要送，
    // 確保就算主執行緒的 rAF 被節流，廣播還是能持續進行。
    workerMsgCount++;
    if (workerMsgCount % 2 === 0) broadcastState();
    drawFrame();
  };
}

// ---------- 連線（跟正式版同一套架構） ----------
let peer = null, conn = null, myRole = null, remoteBodies = [];

function copyRoomId(id) {
  const btn = document.getElementById('copyBtn');
  const done = () => { if (btn) { btn.innerText = '✅ 已複製'; setTimeout(() => btn.innerText = '📋 複製 ID', 1500); } };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(id).then(done).catch(() => fallbackCopy(id, done));
  else fallbackCopy(id, done);
}
function fallbackCopy(text, cb) {
  const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); cb(); } catch (e) { alert('請手動複製：' + text); }
  document.body.removeChild(t);
}

function createRoom() {
  document.activeElement.blur();
  const roomId = 'bgtest-' + Math.floor(1000 + Math.random() * 9000);
  peer = new Peer(roomId); myRole = 'P1';
  createPhysicsWorker();
  document.getElementById('lobbyStatus').innerText = '建立房間中...';
  peer.on('open', (id) => {
    document.getElementById('lobbyStatus').innerHTML =
      `房間 ID：<span style="color:#38bdf8;font-weight:bold;">${id}</span> ` +
      `<button id="copyBtn" class="btn-copy" onclick="copyRoomId('${id}')">📋 複製 ID</button><br><span style="font-size:0.8rem;">等待 P2 連線中...</span>`;
  });
  peer.on('connection', (c) => {
    conn = c; setupConnection();
    document.getElementById('lobbyOverlay').classList.add('hidden');
    physicsWorker.postMessage({ type: 'INIT' });
  });
}
function joinRoom() {
  document.activeElement.blur();
  const targetId = document.getElementById('roomInput').value.trim();
  if (!targetId) return alert('請輸入房間 ID');
  peer = new Peer(); myRole = 'P2';
  document.getElementById('lobbyStatus').innerText = '連線中...';
  peer.on('open', () => { conn = peer.connect(targetId, { reliable: true }); setupConnection(); });
  peer.on('error', () => document.getElementById('lobbyStatus').innerText = '連線失敗，請確認房間 ID');
}
function setupConnection() {
  conn.on('open', () => {
    document.getElementById('lobbyOverlay').classList.add('hidden');
    document.getElementById('diagRole').innerText = '身分：' + myRole;
  });
  conn.on('data', (data) => {
    if (myRole === 'P1' && data.type === 'KEY_INPUT' && currentPlayer === 2) physicsWorker.postMessage({ type: 'KEY', key: data.key });
    else if (myRole === 'P2' && data.type === 'SYNC') applySyncedState(data.state);
  });
}

let broadcastCount = 0, rafTickCount = 0, receivedCount = 0, workerTickCount = 0, workerMsgCount = 0;
let remotePosX = 150, remoteShowPreview = false;
let localBodies = [], showPreview = false; // P1 端從 Worker 收到、鏡像在主執行緒的狀態

function broadcastState() {
  if (myRole !== 'P1' || !conn) return;
  broadcastCount++;
  const snapshot = { currentPlayer, statusMsg, posX, showPreview, bodies: localBodies };
  try { conn.send({ type: 'SYNC', state: snapshot }); } catch (e) {}
}
function applySyncedState(state) {
  receivedCount++;
  currentPlayer = state.currentPlayer; statusMsg = state.statusMsg; remoteBodies = state.bodies;
  remotePosX = state.posX; remoteShowPreview = state.showPreview;
  document.getElementById('statusText').innerText = statusMsg;
  logDiag();
  drawFrame(); // 資料一到就立即重繪，不依賴可能被節流的動畫迴圈
}

const TILE_SIZE = 24, CANVAS_WIDTH = 300, CANVAS_HEIGHT = 480, BAR_ROWS = 4;
const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
let currentPlayer = 1, statusMsg = 'P1 回合：←→移動，空白鍵丟下', posX = CANVAS_WIDTH / 2;

function resetGame() { if (myRole === 'P1' && physicsWorker) physicsWorker.postMessage({ type: 'INIT' }); }

window.addEventListener('keydown', (e) => {
  const k = e.key === ' ' ? ' ' : e.key.toUpperCase();
  if (['ARROWLEFT', 'ARROWRIGHT', ' '].includes(k)) e.preventDefault();
  if (!['ARROWLEFT', 'ARROWRIGHT', ' '].includes(k)) return;

  if (myRole === 'P2') {
    if (currentPlayer === 2 && conn) {
      try { conn.send({ type: 'KEY_INPUT', key: k }); } catch (err) {}
      if (k === 'ARROWLEFT') remotePosX = Math.max(TILE_SIZE, remotePosX - TILE_SIZE);
      else if (k === 'ARROWRIGHT') remotePosX = Math.min(CANVAS_WIDTH - TILE_SIZE, remotePosX + TILE_SIZE);
      drawFrame();
    }
    return;
  }
  // P1 自己按鍵：丟給 Worker 處理，不在主執行緒直接算物理
  if (myRole === 'P1' && currentPlayer === 1 && physicsWorker) physicsWorker.postMessage({ type: 'KEY', key: k });
});

// ---------- 診斷面板 ----------
function logDiag() {
  document.getElementById('diagCounters').innerText =
    `rAF次數: ${rafTickCount}　worker次數: ${workerTickCount}　${myRole === 'P1' ? '廣播' : '收到'}次數: ${myRole === 'P1' ? broadcastCount : receivedCount}`;
}
setInterval(() => {
  if (!myRole) return;
  const line = document.createElement('div');
  const t = new Date().toLocaleTimeString();
  line.innerText = `[${t}] rAF=${rafTickCount} worker=${workerTickCount} ${myRole === 'P1' ? 'bcast' : 'recv'}=${myRole === 'P1' ? broadcastCount : receivedCount}`;
  const log = document.getElementById('diagLog');
  log.appendChild(line);
  while (log.children.length > 30) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}, 1000);

// ---------- 畫面繪製 ----------
function drawTileRun(cx, cy, angle, count, tileSize, vertical) {
  const cos = Math.cos(angle), sin = Math.sin(angle), half = tileSize / 2;
  for (let i = 0; i < count; i++) {
    const off = (i - (count - 1) / 2) * tileSize;
    const lx = vertical ? 0 : off, ly = vertical ? off : 0;
    const corners = [{x:-half,y:-half},{x:half,y:-half},{x:half,y:half},{x:-half,y:half}];
    ctx.beginPath();
    corners.forEach((c, idx) => {
      const wx = cx + (lx + c.x) * cos - (ly + c.y) * sin, wy = cy + (lx + c.x) * sin + (ly + c.y) * cos;
      if (idx === 0) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
    });
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}

function drawBodiesList(list) {
  list.forEach(b => {
    ctx.fillStyle = b.isStatic ? '#546e7a' : '#8ca1ab';
    ctx.strokeStyle = '#18181c'; ctx.lineWidth = 1;
    const g = b.tileGrid, count = g.rows === 1 ? g.cols : g.rows;
    drawTileRun(b.x, b.y, b.angle, count, TILE_SIZE, g.rows !== 1);
  });
}

function drawFrame() {
  ctx.fillStyle = '#141417'; ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

  if (myRole === 'P1') drawBodiesList(localBodies);
  else if (myRole === 'P2') drawBodiesList(remoteBodies);

  if (myRole === 'P1' && showPreview) {
    ctx.save(); ctx.globalAlpha = 0.5; ctx.fillStyle = '#8ca1ab';
    ctx.fillRect(posX - TILE_SIZE / 2, 60 - TILE_SIZE * BAR_ROWS / 2, TILE_SIZE, TILE_SIZE * BAR_ROWS);
    ctx.restore();
  } else if (myRole === 'P2' && remoteShowPreview) {
    ctx.save(); ctx.globalAlpha = 0.5; ctx.fillStyle = '#8ca1ab';
    ctx.fillRect(remotePosX - TILE_SIZE / 2, 60 - TILE_SIZE * BAR_ROWS / 2, TILE_SIZE, TILE_SIZE * BAR_ROWS);
    ctx.restore();
  }
}

// 主執行緒的 rAF 迴圈現在只負責「畫面渲染」，不再跑任何物理/廣播邏輯——
// 這正是這個版本的重點：就算這個迴圈被瀏覽器節流到幾乎停擺，
// Worker 裡的物理模擬跟廣播（透過 worker.onmessage 觸發）依然會持續進行。
function renderLoop() {
  rafTickCount++;
  logDiag();
  drawFrame();
  requestAnimationFrame(renderLoop);
}
requestAnimationFrame(renderLoop);
</script>
</body>
</html>
