<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>過場示意圖設計工作區</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 60px; background: #0a0a0c; color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { text-align: center; font-size: 1.3rem; margin: 0 0 4px; color: #f1f5f9; }
  .sub { text-align: center; color: #a1a1aa; font-size: 0.82rem; margin: 0 0 20px; }

  .tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 18px; }
  .tab-btn {
    padding: 10px 16px; background: #27272a; border: 1px solid #3f3f46; border-radius: 999px;
    color: #d4d4d8; cursor: pointer; font-weight: 700; font-size: 0.85rem; user-select: none;
  }
  .tab-btn.active { background: #4f46e5; border-color: #4f46e5; color: #fff; }

  /* ===== 預覽框架 ===== */
  .preview-frame {
    width: 100%; max-width: 390px; height: 520px; margin: 0 auto;
    background: #000; border-radius: 20px; border: 2px solid #27272a;
    position: relative; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6); overflow: hidden;
  }
  .game-intro-countdown {
    position: absolute; top: 14px; right: 14px; z-index: 10;
    background: rgba(63,63,70,0.9); border: 1px solid #71717a; color: #e2e8f0;
    padding: 6px 14px; border-radius: 8px; font-size: 1rem; font-weight: 700; letter-spacing: 0.5px;
  }
  .game-intro-content { display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 5; }
  .game-intro-tagline { font-size: 1.9rem; font-weight: 800; color: #f1f5f9; letter-spacing: 0.5px; text-align: center; }
  .game-intro-skip {
    position: absolute; right: 16px; bottom: 16px; z-index: 10;
    background: rgba(63,63,70,0.9); border: 1px solid #71717a; color: #e2e8f0;
    padding: 12px 22px; border-radius: 999px; font-size: 1rem; font-weight: 700;
  }

  /* 對照底圖疊加層 */
  .overlay-reference {
    position: absolute; width: 100%; height: 100%; object-fit: contain;
    pointer-events: none; opacity: 0.45; z-index: 2; display: block;
  }

  .intro-illust-box { position: relative; }
  
  /* 堆疊模式元素 */
  .intro-line { position: absolute; left: 0; right: 0; border-top: 3px dashed #4ade80; }
  .intro-stack { position: absolute; display: flex; flex-direction: column-reverse; align-items: center; }
  .intro-block { box-sizing: border-box; }
  
  /* 底座 */
  .intro-base-u {
    position: absolute; bottom: 0; left: 50%;
    display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr);
  }
  .intro-base-slot { background: #5c7482; border: 0.5px solid rgba(0,0,0,0.25); }
  .intro-base-slot.empty { background: transparent; }

  /* 傳統模式元素 */
  .intro-base { position: absolute; border-radius: 3px; background: #3f3f46; }
  .intro-falling-block { position: absolute; border-radius: 4px; }
  .intro-thumb { position: absolute; line-height: 1; }

  /* ===== 控制面板 ===== */
  .controls-panel {
    max-width: 390px; margin: 20px auto 0; background: #141417; border: 1px solid #27272a;
    border-radius: 14px; padding: 16px 18px;
  }
  .controls-title { font-size: 0.85rem; font-weight: 700; color: #cbbe93; margin: 0 0 12px; }
  .control-row { margin-bottom: 14px; }
  .control-row label {
    font-size: 0.8rem; color: #a1a1aa; display: flex; justify-content: space-between; margin-bottom: 4px;
  }
  .control-row label span.val { color: #e2e8f0; font-weight: 700; font-family: monospace; }
  .control-row input[type="range"] { width: 100%; accent-color: #4f46e5; }
  .control-row input[type="color"] { width: 100%; height: 34px; border: none; border-radius: 6px; background: none; }

  .reset-btn {
    display: block; width: 100%; margin-top: 4px; padding: 10px; background: #27272a; border: 1px solid #3f3f46;
    border-radius: 8px; color: #e2e8f0; font-weight: 700; font-size: 0.85rem; cursor: pointer;
  }
  .reset-btn:active { background: #3f3f46; }

  .output-box {
    max-width: 390px; margin: 16px auto 0; background: #0a0a0c; border: 1px solid #27272a; border-radius: 10px;
    padding: 12px 14px; font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 0.74rem; color: #4ade80;
    white-space: pre-wrap; word-break: break-all; line-height: 1.6; max-height: 220px; overflow-y: auto;
  }
  .copy-btn {
    display: block; width: 100%; max-width: 390px; margin: 12px auto 0; padding: 12px; background: #059669;
    border: none; border-radius: 10px; color: #fff; font-weight: 700; font-size: 0.9rem; cursor: pointer;
  }
  .copy-btn:active { background: #047857; }
</style>
</head>
<body>

  <h1>過場示意圖設計工作區</h1>
  <p class="sub">已配置 r1.png 透明圖層，可精確微調 4 個堆疊方塊與底座對齊</p>

  <div class="tabs" id="tabs"></div>

  <div class="preview-frame">
    <!-- r1.png 透明對照疊圖 -->
    <img src="r1.png" alt="r1 reference" class="overlay-reference" id="refOverlay">
    
    <div class="game-intro-countdown">10s</div>
    <div class="game-intro-content">
      <div class="intro-illust-box" id="illustBox"></div>
      <div class="game-intro-tagline" id="tagline"></div>
    </div>
    <div class="game-intro-skip">Skip ⏭</div>
  </div>

  <div class="controls-panel">
    <div class="controls-title" id="controlsTitle">調整參數</div>
    <div class="control-row">
      <label>r1.png 參考圖透明度 <span class="val" id="val-refOpacity">0.45</span></label>
      <input type="range" min="0" max="1" step="0.05" value="0.45" oninput="updateRefOpacity(this.value)">
    </div>
    <div id="controlsBody"></div>
    <button class="reset-btn" onclick="resetCurrent()">還原這個模式的預設值</button>
  </div>

  <div class="output-box" id="outputBox"></div>
  <button class="copy-btn" onclick="copyOutput()">📋 複製目前設定值</button>

<script>
  // ============ 預設參數（精確擬合 r1.png 的方塊堆疊）============
  const DEFAULTS = {
    solo: {
      tagline: 'Reach the Line',
      kind: 'stack',
      boxW: 240, boxH: 220,
      lineY: 24,
      blockW: 68, blockH: 27, radius: 8,
      stackGap: 3, stackBottom: 28, stackOffsetX: 0,
      baseW: 136, baseH: 56,
      colors: ['#7b929e', '#a38f88', '#c7b68b', '#93a697'] // 方塊 1 (底) 到 方塊 4 (頂)
    },
    coop: {
      tagline: 'Reach the Line',
      kind: 'stack',
      boxW: 240, boxH: 220,
      lineY: 24,
      blockW: 68, blockH: 27, radius: 8,
      stackGap: 3, stackBottom: 28, stackOffsetX: 0,
      baseW: 136, baseH: 56,
      colors: ['#7b929e', '#a38f88', '#c7b68b', '#93a697']
    },
    versus: {
      tagline: 'Do Not Drop',
      kind: 'toppling',
      boxW: 160, boxH: 110,
      blockW: 38, blockH: 16,
      colors: ['#8ca1ab', '#af9a92', '#cbbe93', '#9ead9d'],
      baseW: 56, baseH: 14,
      b1X: 50, b1Y: 62, b1Rot: -8,
      b2X: 56, b2Y: 44, b2Rot: 14,
      b3X: 44, b3Y: 26, b3Rot: -20,
      b4X: 60, b4Y: 6, b4Rot: 28
    },
    topple: {
      tagline: 'Topple to Score',
      kind: 'topple',
      boxW: 160, boxH: 110,
      baseX: 8, baseW: 52, baseH: 14,
      f1X: 14, f1Y: 14, f1W: 30, f1H: 20, f1Color: '#af9a92',
      f2X: 56, f2Y: 34, f2W: 30, f2H: 20, f2Color: '#cbbe93',
      thumbSize: 1.3, thumbInset: -4
    }
  };

  const TAB_LABELS = { solo: '單人遊玩', coop: '雙人堆疊', versus: '對抗', topple: '掉落得分' };
  let state = JSON.parse(JSON.stringify(DEFAULTS));
  let currentTab = 'solo';

  function updateRefOpacity(val) {
    document.getElementById('refOverlay').style.opacity = val;
    document.getElementById('val-refOpacity').innerText = val;
  }

  function renderTabs() {
    const wrap = document.getElementById('tabs');
    wrap.innerHTML = Object.keys(TAB_LABELS).map(key =>
      `<div class="tab-btn${key === currentTab ? ' active' : ''}" onclick="switchTab('${key}')">${TAB_LABELS[key]}</div>`
    ).join('');
  }

  function switchTab(key) {
    currentTab = key;
    renderTabs();
    renderControls();
    renderIllustration();
    renderOutput();
  }

  function resetCurrent() {
    state[currentTab] = JSON.parse(JSON.stringify(DEFAULTS[currentTab]));
    renderControls();
    renderIllustration();
    renderOutput();
  }

  const FIELD_DEFS = {
    stack: [
      { key: 'blockW', label: '堆疊方塊：寬度 (px)', min: 30, max: 120, step: 1 },
      { key: 'blockH', label: '堆疊方塊：高度 (px)', min: 10, max: 50, step: 1 },
      { key: 'radius', label: '堆疊方塊：圓角 (px)', min: 0, max: 20, step: 1 },
      { key: 'stackGap', label: '方塊垂直間距 (px)', min: 0, max: 12, step: 1 },
      { key: 'stackBottom', label: '堆疊堆離底高度 (px)', min: 0, max: 80, step: 1 },
      { key: 'stackOffsetX', label: '堆疊水平偏移 (px)', min: -30, max: 30, step: 1 },
      { key: 'baseW', label: '基座：寬度 (px)', min: 60, max: 200, step: 2 },
      { key: 'baseH', label: '基座：高度 (px)', min: 20, max: 90, step: 2 },
      { key: 'lineY', label: '頂部綠虛線位置 (Y)', min: 0, max: 80, step: 1 },
    ],
    toppling: [
      { key: 'blockW', label: '方塊寬度', min: 16, max: 60, step: 1 },
      { key: 'blockH', label: '方塊高度', min: 8, max: 32, step: 1 },
      { key: 'baseW', label: '基座：寬度', min: 30, max: 100, step: 1 },
      { key: 'baseH', label: '基座：高度', min: 6, max: 30, step: 1 },
      { key: 'b1X', label: '方塊①：X', min: 0, max: 130, step: 1 },
      { key: 'b1Y', label: '方塊①：Y', min: 0, max: 90, step: 1 },
      { key: 'b1Rot', label: '方塊①：傾斜角度', min: -45, max: 45, step: 1 },
      { key: 'b2X', label: '方塊②：X', min: 0, max: 130, step: 1 },
      { key: 'b2Y', label: '方塊②：Y', min: 0, max: 90, step: 1 },
      { key: 'b2Rot', label: '方塊②：傾斜角度', min: -45, max: 45, step: 1 },
      { key: 'b3X', label: '方塊③：X', min: 0, max: 130, step: 1 },
      { key: 'b3Y', label: '方塊③：Y', min: 0, max: 90, step: 1 },
      { key: 'b3Rot', label: '方塊③：傾斜角度', min: -45, max: 45, step: 1 },
      { key: 'b4X', label: '方塊④：X', min: 0, max: 130, step: 1 },
      { key: 'b4Y', label: '方塊④：Y', min: 0, max: 90, step: 1 },
      { key: 'b4Rot', label: '方塊④：傾斜角度', min: -45, max: 45, step: 1 },
    ],
    topple: [
      { key: 'baseX', label: '基地：左邊距', min: 0, max: 60, step: 1 },
      { key: 'baseW', label: '基地：寬度', min: 20, max: 100, step: 1 },
      { key: 'baseH', label: '基地：高度', min: 6, max: 30, step: 1 },
      { key: 'f1X', label: '掉落方塊①：X', min: 0, max: 120, step: 1 },
      { key: 'f1Y', label: '掉落方塊①：Y', min: 0, max: 80, step: 1 },
      { key: 'f1W', label: '掉落方塊①：寬度', min: 14, max: 60, step: 1 },
      { key: 'f1H', label: '掉落方塊①：高度', min: 10, max: 40, step: 1 },
      { key: 'f2X', label: '掉落方塊②：X', min: 0, max: 140, step: 1 },
      { key: 'f2Y', label: '掉落方塊②：Y', min: 0, max: 90, step: 1 },
      { key: 'f2W', label: '掉落方塊②：寬度', min: 14, max: 60, step: 1 },
      { key: 'f2H', label: '掉落方塊②：高度', min: 10, max: 40, step: 1 },
      { key: 'thumbSize', label: '👍 大小', min: 0.6, max: 2.5, step: 0.1 },
      { key: 'thumbInset', label: '👍 邊角位移', min: -20, max: 10, step: 1 },
    ],
  };

  function renderControls() {
    const cfg = state[currentTab];
    document.getElementById('controlsTitle').innerText = TAB_LABELS[currentTab] + '｜調整參數';
    const fields = FIELD_DEFS[cfg.kind] || [];
    const body = document.getElementById('controlsBody');
    body.innerHTML = fields.map(f => `
      <div class="control-row">
        <label>${f.label} <span class="val" id="val-${f.key}">${cfg[f.key]}</span></label>
        <input type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${cfg[f.key]}"
               oninput="updateField('${f.key}', this.value)">
      </div>
    `).join('');

    if (cfg.kind === 'stack') {
      const blockNames = ['方塊 1 (最底灰藍)', '方塊 2 (藕粉)', '方塊 3 (淡黃)', '方塊 4 (頂層灰綠)'];
      body.innerHTML += cfg.colors.map((c, i) => `
        <div class="control-row">
          <label>${blockNames[i] || `方塊 ${i+1}`} 顏色</label>
          <input type="color" value="${c}" oninput="updateColor(${i}, this.value)">
        </div>
      `).join('');
    } else if (cfg.kind === 'toppling') {
      body.innerHTML += cfg.colors.map((c, i) => `
        <div class="control-row">
          <label>方塊 ${i + 1} 顏色</label>
          <input type="color" value="${c}" oninput="updateColor(${i}, this.value)">
        </div>
      `).join('');
    } else if (cfg.kind === 'topple') {
      body.innerHTML += `
        <div class="control-row"><label>掉落方塊① 顏色</label>
          <input type="color" value="${cfg.f1Color}" oninput="updateField('f1Color', this.value)"></div>
        <div class="control-row"><label>掉落方塊② 顏色</label>
          <input type="color" value="${cfg.f2Color}" oninput="updateField('f2Color', this.value)"></div>`;
    }
  }

  function updateField(key, value) {
    const num = parseFloat(value);
    state[currentTab][key] = isNaN(num) ? value : num;
    const valEl = document.getElementById('val-' + key);
    if (valEl) valEl.innerText = state[currentTab][key];
    renderIllustration();
    renderOutput();
  }

  function updateColor(index, value) {
    state[currentTab].colors[index] = value;
    renderIllustration();
    renderOutput();
  }

  // ============ 渲染示意圖 ============
  function renderIllustration() {
    const cfg = state[currentTab];
    const box = document.getElementById('illustBox');
    document.getElementById('tagline').innerText = cfg.tagline;
    box.style.width = cfg.boxW + 'px';
    box.style.height = cfg.boxH + 'px';

    if (cfg.kind === 'stack') {
      const blocksHtml = cfg.colors.map(color => `
        <div class="intro-block" style="
          width:${cfg.blockW}px;
          height:${cfg.blockH}px;
          background:${color};
          border-radius:${cfg.radius}px;
          flex-shrink: 0;
        "></div>
      `).join('');

      box.innerHTML = `
        <div class="intro-line" style="top:${cfg.lineY}px;"></div>
        <div class="intro-base-u" style="
          width:${cfg.baseW}px;
          height:${cfg.baseH}px;
          transform:translateX(-50%);
        ">
          <div class="intro-base-slot"></div>
          <div class="intro-base-slot empty"></div>
          <div class="intro-base-slot empty"></div>
          <div class="intro-base-slot"></div>
          <div class="intro-base-slot"></div>
          <div class="intro-base-slot"></div>
          <div class="intro-base-slot"></div>
          <div class="intro-base-slot"></div>
        </div>
        <div class="intro-stack" style="
          bottom:${cfg.stackBottom}px;
          left: calc(50% + ${cfg.stackOffsetX}px);
          transform: translateX(-50%);
          gap: ${cfg.stackGap}px;
        ">
          ${blocksHtml}
        </div>`;
    } else if (cfg.kind === 'toppling') {
      const baseX = (cfg.boxW - cfg.baseW) / 2;
      const blocks = [1, 2, 3, 4].map(i => `
        <div class="intro-block" style="position:absolute; left:${cfg['b' + i + 'X']}px; top:${cfg['b' + i + 'Y']}px; width:${cfg.blockW}px; height:${cfg.blockH}px; background:${cfg.colors[i - 1]}; transform:rotate(${cfg['b' + i + 'Rot']}deg); transform-origin:center; border-radius:4px;"></div>
      `).join('');
      box.innerHTML = `
        <div class="intro-base" style="bottom:0; left:${baseX}px; width:${cfg.baseW}px; height:${cfg.baseH}px;"></div>
        ${blocks}`;
    } else if (cfg.kind === 'topple') {
      box.innerHTML = `
        <div class="intro-base" style="bottom:0; left:${cfg.baseX}px; width:${cfg.baseW}px; height:${cfg.baseH}px;"></div>
        <div class="intro-falling-block" style="left:${cfg.f1X}px; top:${cfg.f1Y}px; width:${cfg.f1W}px; height:${cfg.f1H}px; background:${cfg.f1Color};"></div>
        <div class="intro-falling-block" style="left:${cfg.f2X}px; top:${cfg.f2Y}px; width:${cfg.f2W}px; height:${cfg.f2H}px; background:${cfg.f2Color};"></div>
        <div class="intro-thumb" style="top:${cfg.thumbInset}px; left:${cfg.thumbInset}px; font-size:${cfg.thumbSize}rem;">👍</div>
        <div class="intro-thumb" style="bottom:${cfg.thumbInset}px; left:${cfg.thumbInset}px; font-size:${cfg.thumbSize}rem;">👍</div>
        <div class="intro-thumb" style="top:${cfg.thumbInset}px; right:${cfg.thumbInset}px; font-size:${cfg.thumbSize}rem;">👍</div>
        <div class="intro-thumb" style="bottom:${cfg.thumbInset}px; right:${cfg.thumbInset}px; font-size:${cfg.thumbSize}rem;">👍</div>`;
    }
  }

  function renderOutput() {
    const out = { solo: state.solo, coop: state.coop, versus: state.versus, topple: state.topple };
    document.getElementById('outputBox').innerText = JSON.stringify(out, null, 2);
  }

  function copyOutput() {
    const text = document.getElementById('outputBox').innerText;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => alert('已複製！貼給 Claude 就可以了。'))
        .catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); alert('已複製！'); }
    catch (e) { alert('複製失敗，請手動複製。'); }
    document.body.removeChild(ta);
  }

  // init
  renderTabs();
  renderControls();
  renderIllustration();
  renderOutput();
</script>
</body>
</html>
