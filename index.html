<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色受擊調校系統 - 專屬配置版</title>
    <style>
        :root {
            --hit-size: 45%;
            --char-scale-delta: 0.005; /* 0.5% */
            --char-flash: 1.2;         /* 1.2x */
            --hit-brightness: 1.0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121316;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 16px 40px;
            user-select: none;
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 12px;
            color: #94a3b8;
            font-weight: 500;
        }

        /* 角色舞台容器 */
        .stage-container {
            position: relative;
            display: inline-block;
            height: 50vh;
            min-height: 340px;
            cursor: pointer;
        }

        .character-img {
            display: block;
            height: 100%;
            width: auto;
            pointer-events: none;
            transform-origin: center center;
            will-change: transform, filter;
        }

        /* 角色受擊微幅晃動與閃光 */
        .character-img.shake {
            animation: char-hit-reaction 0.18s cubic-bezier(0.2, 0.8, 0.4, 1.2);
        }

        @keyframes char-hit-reaction {
            0% {
                transform: scale(1);
                filter: brightness(1);
            }
            35% {
                transform: scale(calc(1 - var(--char-scale-delta))) translate(-1.5px, 1.5px);
                filter: brightness(var(--char-flash));
            }
            70% {
                transform: scale(calc(1 + var(--char-scale-delta))) translate(1.5px, -1px);
                filter: brightness(calc(1 + (var(--char-flash) - 1) * 0.35));
            }
            100% {
                transform: scale(1) translate(0, 0);
                filter: brightness(1);
            }
        }

        /* 受擊特效圖片 */
        .hit-effect {
            position: absolute;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: var(--hit-size);
            filter: brightness(var(--hit-brightness));
            animation: hit-anim 0.32s cubic-bezier(0.15, 0.85, 0.35, 1.2) forwards;
        }

        @keyframes hit-anim {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3) rotate(var(--rot, 0deg));
            }
            25% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.08) rotate(var(--rot, 0deg));
            }
            70% {
                opacity: 0.95;
                transform: translate(-50%, -50%) scale(1.0) rotate(var(--rot, 0deg));
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.2) rotate(var(--rot, 0deg));
            }
        }

        /* 受擊點除錯紅點 */
        .debug-point {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #ef4444;
            border: 2px solid #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 20;
            box-shadow: 0 0 6px rgba(0,0,0,0.8);
            display: none;
            transition: left 0.12s ease, top 0.12s ease;
        }

        .debug-point.active {
            display: block;
        }

        /* 操作按鈕群 */
        .action-row {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-hit {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            padding: 10px 36px;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
            transition: transform 0.08s ease;
        }

        .btn-hit:active {
            transform: scale(0.96);
        }

        .btn-preset-top {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 10px 22px;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
            transition: all 0.15s ease;
        }

        .btn-preset-top:hover {
            filter: brightness(1.1);
        }

        .btn-preset-top:active {
            transform: scale(0.96);
        }

        .hit-log {
            font-size: 0.85rem;
            color: #94a3b8;
            height: 20px;
            margin-top: 6px;
        }

        /* 參數調校面板 */
        .panel {
            margin-top: 14px;
            background: #1a1c22;
            border: 1px solid #2e3440;
            border-radius: 12px;
            padding: 18px 22px;
            width: 100%;
            max-width: 680px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 20px;
        }

        @media (max-width: 620px) {
            .panel {
                grid-template-columns: 1fr;
            }
        }

        .panel-full {
            grid-column: 1 / -1;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .badge {
            background: #282f3d;
            color: #38bdf8;
            padding: 2px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            font-weight: 600;
        }

        input[type="range"] {
            accent-color: #38bdf8;
            cursor: pointer;
            width: 100%;
        }

        /* 特效切換按鈕群組 */
        .image-switch-group {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        .btn-switch {
            flex: 1;
            padding: 7px 10px;
            background: #232731;
            border: 1px solid #334155;
            color: #94a3b8;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.15s ease;
        }

        .btn-switch:hover {
            background: #2e3646;
            color: #fff;
        }

        .btn-switch.active {
            background: #0284c7;
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        /* 底部控制列 */
        .panel-footer {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #2a313d;
            padding-top: 14px;
            margin-top: 4px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .toggle-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .footer-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .btn-preset {
            background: #f59e0b;
            color: #1e1b18;
            font-weight: 700;
        }

        .btn-preset:hover {
            background: #fbbf24;
        }

        .btn-copy {
            background: #10b981;
            color: #ffffff;
            border: none;
        }

        .btn-copy:hover {
            background: #059669;
        }

        .btn-reset {
            background: transparent;
            border-color: #475569;
            color: #cbd5e1;
        }

        .btn-reset:hover {
            background: #334155;
            color: #fff;
        }
    </style>
</head>
<body>

    <h1>角色受擊效果調校工具</h1>

    <!-- 舞台展示區 -->
    <div class="stage-container" id="stage" title="點擊騎士軀幹觸發受擊">
        <img src="character.png" alt="Knight" class="character-img" id="character">
        <div id="debug-points-group"></div>
    </div>

    <!-- 攻擊操作按鈕列 -->
    <div class="action-row">
        <button class="btn-hit" id="hitBtn">攻擊肩胸 (空白鍵)</button>
        <button class="btn-preset-top" id="presetTopBtn">⭐ 一鍵載入喜愛配置</button>
    </div>
    <div class="hit-log" id="infoText">就緒</div>

    <!-- 調校控制面板 -->
    <div class="panel">

        <!-- 1. 受擊素材切換 -->
        <div class="control-item panel-full">
            <div class="control-header">
                <span>被擊中特效素材切換</span>
                <span class="badge" id="currentHitText">hit3.png</span>
            </div>
            <div class="image-switch-group">
                <button class="btn-switch" data-img="hit1.png">hit1.png</button>
                <button class="btn-switch" data-img="hit2.png">hit2.png</button>
                <button class="btn-switch active" data-img="hit3.png">hit3.png</button>
            </div>
        </div>

        <!-- 2. 隨機旋轉角度範圍 -->
        <div class="control-item">
            <div class="control-header">
                <span>特效隨機旋轉幅度</span>
                <span class="badge" id="rotVal">±180°</span>
            </div>
            <input type="range" id="rotSlider" min="30" max="180" value="180" step="5">
        </div>

        <!-- 3. 特效尺寸 -->
        <div class="control-item">
            <div class="control-header">
                <span>特效基礎尺寸</span>
                <span class="badge" id="sizeVal">45%</span>
            </div>
            <input type="range" id="sizeSlider" min="15" max="55" value="45">
        </div>

        <!-- 4. 角色縮放幅度 -->
        <div class="control-item">
            <div class="control-header">
                <span>角色受擊縮放 (變大/變小)</span>
                <span class="badge" id="scaleVal">0.5%</span>
            </div>
            <input type="range" id="scaleSlider" min="0" max="15" value="0.5" step="0.5">
        </div>

        <!-- 5. 角色閃爍亮度 -->
        <div class="control-item">
            <div class="control-header">
                <span>角色受擊閃爍幅度</span>
                <span class="badge" id="flashVal">1.2x</span>
            </div>
            <input type="range" id="flashSlider" min="1.0" max="3.0" value="1.2" step="0.1">
        </div>

        <!-- 6. 特效圖片亮暗 -->
        <div class="control-item">
            <div class="control-header">
                <span>特效自身明暗度</span>
                <span class="badge" id="brightnessVal">100%</span>
            </div>
            <input type="range" id="brightnessSlider" min="40" max="220" value="100" step="5">
        </div>

        <!-- 7. 七個點擴散/靠攏程度 -->
        <div class="control-item">
            <div class="control-header">
                <span>7 個受擊點擴散程度</span>
                <span class="badge" id="spreadVal">2.6x</span>
            </div>
            <input type="range" id="spreadSlider" min="0.3" max="2.6" value="2.6" step="0.1">
        </div>

        <!-- 面板底部操作按鈕 -->
        <div class="panel-footer">
            <label class="toggle-label">
                <input type="checkbox" id="toggleDebug">
                <span>顯示 7 個點位即時標記 (勾選檢視肩胸點)</span>
            </label>
            <div class="footer-btns">
                <button class="btn-action btn-preset" id="presetBtn">載入喜愛配置</button>
                <button class="btn-action btn-copy" id="copyBtn">複製目前所有參數</button>
                <button class="btn-action btn-reset" id="resetBtn">恢復預設基準</button>
            </div>
        </div>

    </div>

    <script>
        // -------------------------------------------------------------
        // 重新調校後的 7 個點位：專注在【肩膀】與【胸口】，完全避開臉部與肚子
        // 基準中心上移至肩胸交會點 (50.0%, 28.5%)
        // -------------------------------------------------------------
        const chestCenter = { x: 50.0, y: 28.5 };
        
        // 當擴散倍率為 2.6x 時：
        // Y 最高約 24.1%（剛好在肩甲上緣/鎖骨，完全在面罩之下）
        // Y 最低約 33.2%（剛好在胸甲下緣，完全在肚子皮帶上方）
        // X 範圍約 36% ~ 64%（正好覆蓋左右肩甲與盾牌內側）
        const baseOffsets = [
            { dx: 0.0,  dy: 0.5,  name: "胸口正中央" },
            { dx: -5.4, dy: -1.7, name: "左肩甲 (近披風側)" },
            { dx: 5.4,  dy: -1.4, name: "右肩甲 (盾牌上方)" },
            { dx: -2.8, dy: -0.8, name: "左上胸 / 鎖骨處" },
            { dx: 2.8,  dy: -0.5, name: "右上胸 / 鎖骨處" },
            { dx: -1.5, dy: 1.8,  name: "左中胸 (心窩微左)" },
            { dx: 1.5,  dy: 1.8,  name: "右中胸 (心窩微右)" }
        ];

        let activePoints = [];
        let currentHitImage = 'hit3.png';

        // DOM 元素選取
        const stage = document.getElementById('stage');
        const character = document.getElementById('character');
        const hitBtn = document.getElementById('hitBtn');
        const presetTopBtn = document.getElementById('presetTopBtn');
        const presetBtn = document.getElementById('presetBtn');
        const infoText = document.getElementById('infoText');
        const debugGroup = document.getElementById('debug-points-group');
        const toggleDebug = document.getElementById('toggleDebug');
        const copyBtn = document.getElementById('copyBtn');
        const resetBtn = document.getElementById('resetBtn');

        // 拉條與顯示標籤
        const rotSlider = document.getElementById('rotSlider');
        const rotVal = document.getElementById('rotVal');

        const sizeSlider = document.getElementById('sizeSlider');
        const sizeVal = document.getElementById('sizeVal');

        const scaleSlider = document.getElementById('scaleSlider');
        const scaleVal = document.getElementById('scaleVal');

        const flashSlider = document.getElementById('flashSlider');
        const flashVal = document.getElementById('flashVal');

        const brightnessSlider = document.getElementById('brightnessSlider');
        const brightnessVal = document.getElementById('brightnessVal');

        const spreadSlider = document.getElementById('spreadSlider');
        const spreadVal = document.getElementById('spreadVal');

        const currentHitText = document.getElementById('currentHitText');
        const switchBtns = document.querySelectorAll('.btn-switch');

        // 建立 7 個除錯紅點
        const debugDots = [];
        baseOffsets.forEach((_, idx) => {
            const dot = document.createElement('div');
            dot.className = 'debug-point';
            debugGroup.appendChild(dot);
            debugDots.push(dot);
        });

        // 重新計算 7 個受擊點位置
        function updatePointsPositions() {
            const spread = parseFloat(spreadSlider.value);
            activePoints = baseOffsets.map((pt, idx) => {
                const posX = chestCenter.x + (pt.dx * spread);
                const posY = chestCenter.y + (pt.dy * spread);

                debugDots[idx].style.left = posX + '%';
                debugDots[idx].style.top = posY + '%';
                debugDots[idx].title = `點位 ${idx + 1}: ${pt.name} (${posX.toFixed(1)}%, ${posY.toFixed(1)}%)`;

                return { x: posX, y: posY, name: pt.name };
            });
        }

        // 圖片切換函式
        function selectHitImage(imgName) {
            switchBtns.forEach(btn => {
                const isActive = btn.getAttribute('data-img') === imgName;
                btn.classList.toggle('active', isActive);
            });
            currentHitImage = imgName;
            currentHitText.textContent = imgName;
        }

        switchBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                selectHitImage(btn.getAttribute('data-img'));
            });
        });

        // -------------------------------------------------------------
        // 拉條事件綁定
        // -------------------------------------------------------------
        rotSlider.addEventListener('input', (e) => {
            rotVal.textContent = `±${e.target.value}°`;
        });

        sizeSlider.addEventListener('input', (e) => {
            sizeVal.textContent = `${e.target.value}%`;
            document.documentElement.style.setProperty('--hit-size', `${e.target.value}%`);
        });

        scaleSlider.addEventListener('input', (e) => {
            scaleVal.textContent = `${e.target.value}%`;
            document.documentElement.style.setProperty('--char-scale-delta', (parseFloat(e.target.value) / 100));
        });

        flashSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value).toFixed(1);
            flashVal.textContent = `${val}x`;
            document.documentElement.style.setProperty('--char-flash', val);
        });

        brightnessSlider.addEventListener('input', (e) => {
            brightnessVal.textContent = `${e.target.value}%`;
            document.documentElement.style.setProperty('--hit-brightness', (parseFloat(e.target.value) / 100));
        });

        spreadSlider.addEventListener('input', (e) => {
            spreadVal.textContent = `${parseFloat(e.target.value).toFixed(1)}x`;
            updatePointsPositions();
        });

        toggleDebug.addEventListener('change', (e) => {
            debugDots.forEach(d => d.classList.toggle('active', e.target.checked));
        });

        // -------------------------------------------------------------
        // ⭐ 一鍵載入專屬喜愛配置
        // -------------------------------------------------------------
        function applyFavoritePreset() {
            selectHitImage('hit3.png');

            rotSlider.value = 180;
            rotSlider.dispatchEvent(new Event('input'));

            sizeSlider.value = 45;
            sizeSlider.dispatchEvent(new Event('input'));

            brightnessSlider.value = 100;
            brightnessSlider.dispatchEvent(new Event('input'));

            spreadSlider.value = 2.6;
            spreadSlider.dispatchEvent(new Event('input'));

            scaleSlider.value = 0.5;
            scaleSlider.dispatchEvent(new Event('input'));

            flashSlider.value = 1.2;
            flashSlider.dispatchEvent(new Event('input'));

            infoText.textContent = "✓ 已載入你喜歡的專屬配置 (hit3 / ±180° / 45% / 2.6x)";
        }

        presetTopBtn.addEventListener('click', applyFavoritePreset);
        presetBtn.addEventListener('click', applyFavoritePreset);

        // -------------------------------------------------------------
        // 複製參數至剪貼簿
        // -------------------------------------------------------------
        copyBtn.addEventListener('click', async () => {
            const configText = 
`=== 角色受擊效果參數設定 ===
特效圖檔: ${currentHitImage}
特效旋轉範圍: ±${rotSlider.value}°
特效基礎尺寸: ${sizeSlider.value}%
特效圖片亮度: ${brightnessSlider.value}%
受擊點擴散倍率: ${spreadSlider.value}x
角色受擊縮放幅度: ${scaleSlider.value}%
角色受擊閃爍亮度: ${flashSlider.value}x
========================`;

            try {
                await navigator.clipboard.writeText(configText);
                const originalText = copyBtn.textContent;
                copyBtn.textContent = "✓ 已複製參數！";
                copyBtn.style.background = "#047857";
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                    copyBtn.style.background = "";
                }, 1600);
            } catch (err) {
                prompt("請手動複製下方參數設定：", configText);
            }
        });

        // 恢復最初基準值
        resetBtn.addEventListener('click', () => {
            selectHitImage('hit1.png');
            rotSlider.value = 90;
            rotSlider.dispatchEvent(new Event('input'));
            sizeSlider.value = 26;
            sizeSlider.dispatchEvent(new Event('input'));
            scaleSlider.value = 2;
            scaleSlider.dispatchEvent(new Event('input'));
            flashSlider.value = 1.4;
            flashSlider.dispatchEvent(new Event('input'));
            brightnessSlider.value = 100;
            brightnessSlider.dispatchEvent(new Event('input'));
            spreadSlider.value = 1.0;
            spreadSlider.dispatchEvent(new Event('input'));
            infoText.textContent = "已重設為系統預設基準";
        });

        // -------------------------------------------------------------
        // 受擊觸發
        // -------------------------------------------------------------
        function triggerHit() {
            const randomIndex = Math.floor(Math.random() * activePoints.length);
            const targetPoint = activePoints[randomIndex];

            // 旋轉隨機角度 (-maxRot ~ +maxRot)
            const maxRot = parseFloat(rotSlider.value);
            const randomRotation = (Math.random() * 2 - 1) * maxRot;

            const hitImg = document.createElement('img');
            hitImg.src = currentHitImage;
            hitImg.className = 'hit-effect';
            hitImg.style.left = targetPoint.x + '%';
            hitImg.style.top = targetPoint.y + '%';
            hitImg.style.setProperty('--rot', `${randomRotation.toFixed(1)}deg`);
            stage.appendChild(hitImg);

            // 角色微幅反應
            character.classList.remove('shake');
            void character.offsetWidth;
            character.classList.add('shake');

            infoText.textContent = `【${currentHitImage}】擊中：${targetPoint.name} (旋轉: ${randomRotation.toFixed(0)}°)`;

            setTimeout(() => {
                hitImg.remove();
            }, 340);
        }

        // 初始化套用喜愛配置
        applyFavoritePreset();

        hitBtn.addEventListener('click', triggerHit);
        stage.addEventListener('click', triggerHit);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                triggerHit();
            }
        });
    </script>
</body>
</html>
